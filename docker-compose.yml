# Anhy Clips on one server: the app, PostgreSQL, and Caddy for HTTPS.
# Copy .env.example to .env, fill it in, then:  docker compose up -d --build
# A server of its own: also set COMPOSE_PROFILES=own-https in .env. A shared server: see deploy/nginx-anhy.conf.
services:
  db:
    image: postgres:16-alpine
    mem_limit: ${ANHY_DB_MEM_LIMIT:-0}
    restart: unless-stopped
    environment:
      # The database user and name. A server set up before the name changed keeps the database it already
      # has by putting these two lines in .env:   POSTGRES_USER=peakcut   POSTGRES_DB=peakcut
      POSTGRES_USER: ${POSTGRES_USER:-anhy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-anhy}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-anhy}"]
      interval: 10s
      timeout: 5s
      retries: 6

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://${POSTGRES_USER:-anhy}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-anhy}}
      ANHY_PUBLIC_URL: https://${ANHY_DOMAIN:?set ANHY_DOMAIN in .env}
      # On a server everyone signs in. Set ANHY_ACCOUNTS=0 in .env only if the site is private to you.
      ANHY_ACCOUNTS: ${ANHY_ACCOUNTS:-1}
    volumes:
      - data:/data
      - ./secrets:/secrets:ro
      - ./.git:/app/.git:ro            # only to tell which version is running, for the update notice
    # Reachable from this server only. On a server that already has a web server, point that one at this port
    # (see deploy/nginx-anhy.conf). With the "own-https" profile, Caddy below is the web server instead.
    ports: ["127.0.0.1:${ANHY_BIND_PORT:-8765}:8765"]
    # On a server shared with other apps, these keep Anhy Clips inside its own share (all unlimited by default):
    # a memory ceiling with no swap, a processor ceiling, a lower turn at the processor when the server is busy,
    # and "stop this one first" if the whole server ever runs out of memory.
    mem_limit: ${ANHY_MEM_LIMIT:-0}
    memswap_limit: ${ANHY_MEM_LIMIT:-0}
    cpus: ${ANHY_CPUS:-0}
    cpu_shares: ${ANHY_CPU_SHARES:-1024}
    oom_score_adj: ${ANHY_OOM_SCORE_ADJ:-0}

  # Only on a server Anhy Clips has to itself: add COMPOSE_PROFILES=own-https to .env and Caddy handles HTTPS.
  caddy:
    profiles: ["own-https"]
    image: caddy:2
    restart: unless-stopped
    depends_on: [app]
    ports: ["80:80", "443:443"]
    environment:
      ANHY_DOMAIN: ${ANHY_DOMAIN}
    volumes:
      # Caddyfile fetches certificates by itself; Caddyfile.origin uses a Cloudflare origin certificate from ./secrets
      - ./deploy/${ANHY_CADDYFILE:-Caddyfile}:/etc/caddy/Caddyfile:ro
      - ./secrets:/secrets:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  data:
  caddy_data:
  caddy_config:

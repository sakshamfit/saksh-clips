<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in | Anhy Clips</title>
<link rel="icon" type="image/svg+xml" href="/brand/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>
(function(){
  try {
    var t = localStorage.getItem("anhy-theme");
    if (!t) t = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    document.documentElement.dataset.theme = t;
    document.documentElement.classList.toggle("dark", t === "dark");
  } catch (e) {}
})();
</script>
<link rel="stylesheet" href="/assets/app-theme.css">
<style>
body{min-height:100vh;display:flex;flex-direction:column;background:var(--bg);color:var(--ink)}
.auth-top{height:64px;max-width:1120px;width:100%;margin:0 auto;padding:0 24px;display:flex;align-items:center;justify-content:space-between}
.auth-top img{height:26px;display:block}
.auth-wrap{flex:1;display:grid;place-items:center;padding:24px 16px 48px}
.auth-card{width:100%;max-width:420px;background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:32px;box-shadow:var(--shadow-sm)}
.auth-card h1{margin:0 0 6px;font-size:24px;font-weight:600;letter-spacing:-0.025em;color:var(--ink)}
.auth-card .sub{margin:0 0 24px;font-size:14px;color:var(--muted)}
form{display:flex;flex-direction:column;gap:14px}
label.fld{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:500;color:var(--ink-2)}
label.fld input{height:42px;padding:0 13px;border-radius:10px;border:1px solid var(--border-2);background:var(--bg);color:var(--ink);font-size:14px;transition:border-color .15s ease,background-color .15s ease}
label.fld input:focus{outline:none;border-color:var(--ink);background:var(--surface)}
.pwrow{display:flex;justify-content:space-between;align-items:baseline}
.pwrow a{font-size:12.5px;font-weight:500;color:var(--muted);text-decoration:none}
.pwrow a:hover{color:var(--ink);text-decoration:underline}
.pwwrap{position:relative;display:flex;align-items:center}
.pwwrap input{width:100%;padding-right:42px}
.pwbtn{position:absolute;right:6px;width:32px;height:32px;border:0;border-radius:7px;background:transparent;color:var(--muted);display:grid;place-items:center;cursor:pointer}
.pwbtn:hover{background:var(--surface-2);color:var(--ink)}
.pwbtn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.hint{font-size:12px;color:var(--subtle);font-weight:400}
.btn{height:42px;padding:0 16px;border-radius:10px;border:1px solid var(--border-2);background:var(--surface);color:var(--ink);font-size:14px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:9px;cursor:pointer;text-decoration:none;transition:background-color .15s ease,border-color .15s ease,opacity .15s ease}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:var(--accent-hover)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.or{display:flex;align-items:center;gap:12px;margin:18px 0;font-size:12px;color:var(--subtle)}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--border)}
.err{display:none;background:var(--bad-soft);border:1px solid var(--bad-border);color:var(--bad);padding:10px 12px;border-radius:10px;font-size:13px;font-weight:500}
.err.on{display:block}
.swap{margin:20px 0 0;text-align:center;font-size:13.5px;color:var(--muted)}
.swap a{color:var(--ink);font-weight:600;text-decoration:none}
.swap a:hover{text-decoration:underline}
.legal{margin:16px 0 0;text-align:center;font-size:12px;color:var(--subtle);line-height:1.5}
.legal a{color:var(--muted)}
.auth-foot{padding:16px 24px 24px;text-align:center;font-size:12px;color:var(--subtle)}
.auth-foot a{color:var(--muted);text-decoration:none}
.auth-foot a:hover{color:var(--ink)}
.g{width:18px;height:18px}
@media (max-width:480px){.auth-card{padding:24px 20px;border-radius:14px}}
</style>
</head>
<body>
<header class="auth-top">
  <a href="/" aria-label="Anhy Clips home"><img class="brand-logo-auto" src="/brand/logo.svg" alt="Anhy Clips"></a>
  <button type="button" class="theme-toggle-btn" id="themeBtn" aria-label="Toggle dark and light theme" title="Toggle theme">
    <svg class="ico-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
    <svg class="ico-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
  </button>
</header>
<main class="auth-wrap">
  <div class="auth-card">
    <h1 id="h">Welcome back</h1>
    <p class="sub" id="p">Sign in to get back to your clips.</p>
    <a class="btn" id="google" href="/auth/google/start" hidden>
      <svg class="g" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
      <span id="gtext">Sign in with Google</span>
    </a>
    <div class="or" id="or" hidden>or with email</div>
    <form id="f" novalidate>
      <div class="err" id="err" role="alert"></div>
      <label class="fld" id="namebox" hidden>Name<input id="name" type="text" autocomplete="name" placeholder="What should we call you?"></label>
      <label class="fld">Email<input id="email" type="email" autocomplete="email" placeholder="you@example.com" required></label>
      <label class="fld">
        <span class="pwrow"><span>Password</span><a id="forgot" href="/reset">Forgot password?</a></span>
        <span class="pwwrap">
          <input id="password" type="password" autocomplete="current-password" placeholder="Your password" required minlength="8">
          <button type="button" class="pwbtn" id="pwshow" aria-label="Show password" aria-pressed="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </span>
        <span class="hint" id="pwhint" hidden>At least 8 characters.</span>
      </label>
      <button class="btn primary" id="go" type="submit">Sign in</button>
    </form>
    <p class="legal">By continuing you agree to our <a href="/terms">Terms</a> and <a href="/privacy">Privacy Policy</a>.</p>
    <p class="swap" id="swap"></p>
  </div>
</main>
<footer class="auth-foot">© <span id="year"></span> Anhy Clips · <a href="/privacy">Privacy</a> · <a href="/terms">Terms</a> · <a href="/">Home</a></footer>
<script>
document.getElementById("year").textContent = new Date().getFullYear();
document.getElementById("themeBtn").addEventListener("click", () => {
  const next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = next;
  document.documentElement.classList.toggle("dark", next === "dark");
  try { localStorage.setItem("anhy-theme", next); } catch (e) {}
});
const $ = id => document.getElementById(id), up = location.pathname === "/signup";
const next = new URLSearchParams(location.search).get("next");
const dest = next && /^\/(?![\/\\])[^\\\t\r\n]*$/.test(next) ? next : "/app";
document.title = up ? "Create your Anhy Clips account" : "Sign in to Anhy Clips";
$("h").textContent = up ? "Create your account" : "Welcome back";
$("p").textContent = up ? "Start clipping videos and live streams in minutes." : "Sign in to return to your studio.";
$("go").textContent = up ? "Create account" : "Sign in";
$("gtext").textContent = up ? "Sign up with Google" : "Sign in with Google";
$("namebox").hidden = !up; $("pwhint").hidden = !up; $("forgot").hidden = up;
$("password").autocomplete = up ? "new-password" : "current-password";
$("password").placeholder = up ? "Choose a password" : "Your password";
$("pwshow").addEventListener("click", () => {
  const p = $("password"), on = p.type === "password";
  p.type = on ? "text" : "password";
  $("pwshow").setAttribute("aria-pressed", String(on));
  $("pwshow").setAttribute("aria-label", on ? "Hide password" : "Show password");
  p.focus();
});
$("swap").innerHTML = up ? 'Already have an account? <a href="/login">Sign in</a>' : 'New to Anhy Clips? <a href="/signup">Create an account</a>';
$("google").href = "/auth/google/start?next=" + encodeURIComponent(dest);
const fail = m => { $("err").textContent = m; $("err").classList.add("on"); };
if (new URLSearchParams(location.search).get("error") === "google") fail("Google sign-in didn't finish. Try again, or use your email.");
fetch("/api/public").then(r => r.json()).then(p => {
  if (p.google) { $("google").hidden = false; $("or").hidden = false; }
}).catch(() => {});
$("f").addEventListener("submit", async e => {
  e.preventDefault(); $("err").classList.remove("on");
  const email = $("email").value.trim(), password = $("password").value;
  if (!email || !password) return fail("Enter your email and password.");
  $("go").disabled = true;
  try {
    const r = await fetch(up ? "/api/auth/signup" : "/api/auth/login", {method:"POST", headers:{"Content-Type":"application/json"},
      body:JSON.stringify({email, password, name:$("name").value.trim()})});
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(typeof d.detail === "string" ? d.detail : "Something went wrong. Try again.");
    location.href = dest;
  } catch (err) { fail(err.message); $("go").disabled = false; }
});
</script>
</body>
</html>

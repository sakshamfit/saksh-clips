<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset password | Anhy Clips</title>
<link rel="icon" type="image/svg+xml" href="/brand/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>
(function(){
  try {
    var t = localStorage.getItem("anhy-theme");
    if (!t) t = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    document.documentElement.dataset.theme = t;
    document.documentElement.classList.toggle("dark", t === "dark");
  } catch (e) {}
})();
</script>
<link rel="stylesheet" href="/assets/app-theme.css">
<style>
body{min-height:100vh;display:flex;flex-direction:column;background:var(--bg);color:var(--ink)}
.auth-top{height:64px;max-width:1120px;width:100%;margin:0 auto;padding:0 24px;display:flex;align-items:center;justify-content:space-between}
.auth-top img{height:26px;display:block}
.auth-wrap{flex:1;display:grid;place-items:center;padding:24px 16px 48px}
.auth-card{width:100%;max-width:420px;background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:32px;box-shadow:var(--shadow-sm)}
.auth-card h1{margin:0 0 6px;font-size:24px;font-weight:600;letter-spacing:-0.025em;color:var(--ink)}
.auth-card .sub{margin:0 0 24px;font-size:14px;color:var(--muted)}
form{display:flex;flex-direction:column;gap:14px}
label.fld{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:500;color:var(--ink-2)}
label.fld input{height:42px;padding:0 13px;border-radius:10px;border:1px solid var(--border-2);background:var(--bg);color:var(--ink);font-size:14px;transition:border-color .15s ease,background-color .15s ease}
label.fld input:focus{outline:none;border-color:var(--ink);background:var(--surface)}
.hint{font-size:12px;color:var(--subtle);font-weight:400}
.btn{height:42px;padding:0 16px;border-radius:10px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);font-size:14px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;transition:background-color .15s ease,opacity .15s ease}
.btn:hover{background:var(--accent-hover)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.err{display:none;background:var(--bad-soft);border:1px solid var(--bad-border);color:var(--bad);padding:10px 12px;border-radius:10px;font-size:13px;font-weight:500}
.err.on{display:block}
.okbox{background:var(--good-soft);border:1px solid var(--good-border);color:var(--good);padding:14px 16px;border-radius:10px;font-size:13.5px;line-height:1.55}
.swap{margin:20px 0 0;text-align:center;font-size:13.5px;color:var(--muted)}
.swap a{color:var(--ink);font-weight:600;text-decoration:none}
.swap a:hover{text-decoration:underline}
.auth-foot{padding:16px 24px 24px;text-align:center;font-size:12px;color:var(--subtle)}
.auth-foot a{color:var(--muted);text-decoration:none}
</style>
</head>
<body>
<header class="auth-top">
  <a href="/" aria-label="Anhy Clips home"><img class="brand-logo-auto" src="/brand/logo.svg" alt="Anhy Clips"></a>
  <button type="button" class="theme-toggle-btn" id="themeBtn" aria-label="Toggle dark and light theme" title="Toggle theme">
    <svg class="ico-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
    <svg class="ico-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
  </button>
</header>
<main class="auth-wrap">
  <div class="auth-card">
    <h1 id="h">Reset your password</h1>
    <p class="sub" id="p">Enter the email you signed up with and we'll send you a link to choose a new password.</p>
    <form id="ask" novalidate>
      <div class="err" id="err" role="alert"></div>
      <label class="fld">Email<input id="email" type="email" autocomplete="email" placeholder="you@example.com" required></label>
      <button class="btn" id="go1" type="submit">Send reset link</button>
    </form>
    <div id="sent" hidden><div class="okbox">If there's an account for that email, a reset link is on its way. It works for one hour. Check your spam folder if you don't see it.</div></div>
    <form id="set" novalidate hidden>
      <div class="err" id="err2" role="alert"></div>
      <label class="fld">New password<input id="pw" type="password" autocomplete="new-password" required minlength="8"><span class="hint">At least 8 characters.</span></label>
      <label class="fld">Confirm password<input id="pw2" type="password" autocomplete="new-password" required minlength="8"></label>
      <button class="btn" id="go2" type="submit">Save new password</button>
    </form>
    <p class="swap"><a href="/login">Back to sign in</a></p>
  </div>
</main>
<footer class="auth-foot">© <span id="year"></span> Anhy Clips · <a href="/privacy">Privacy</a> · <a href="/terms">Terms</a></footer>
<script>
document.getElementById("year").textContent = new Date().getFullYear();
document.getElementById("themeBtn").addEventListener("click", () => {
  const next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = next;
  document.documentElement.classList.toggle("dark", next === "dark");
  try { localStorage.setItem("anhy-theme", next); } catch (e) {}
});
const q = new URLSearchParams(location.search), token = q.get("t");
const $ = id => document.getElementById(id);
const fail = (box, m) => { $(box).textContent = m; $(box).classList.add("on"); };
if (token) {
  $("ask").hidden = true; $("set").hidden = false;
  $("h").textContent = "Choose a new password"; $("p").textContent = "You'll be signed in, and signed out everywhere else.";
}
$("ask").addEventListener("submit", async e => {
  e.preventDefault(); $("err").classList.remove("on");
  const email = $("email").value.trim(); if (!email) return fail("err", "Enter your email.");
  $("go1").disabled = true;
  try {
    const r = await fetch("/api/auth/forgot", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({email})});
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(typeof d.detail === "string" ? d.detail : "Something went wrong. Try again.");
    $("ask").hidden = true; $("sent").hidden = false;
  } catch (err) { fail("err", err.message); $("go1").disabled = false; }
});
$("set").addEventListener("submit", async e => {
  e.preventDefault(); $("err2").classList.remove("on");
  const a = $("pw").value, b = $("pw2").value;
  if (a.length < 8) return fail("err2", "Use at least 8 characters.");
  if (a !== b) return fail("err2", "The two passwords don't match.");
  $("go2").disabled = true;
  try {
    const r = await fetch("/api/auth/reset", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({token, password:a})});
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(typeof d.detail === "string" ? d.detail : "Something went wrong. Try again.");
    location.href = "/app";
  } catch (err) { fail("err2", err.message); $("go2").disabled = false; }
});
</script>
</body>
</html>
